sources:
  oryxbot_client_logs:
    type: "file"
    include:
      - "/home/oryxbot/apps/Oryxbot/*.log"

sinks:
  oryxbot_server_logs:
    type: "http"
    inputs:
      - oryxbot_client_logs
    uri: "https://logs.oryxbot.com/api/default/default/_json"
    method: "post"
    auth:
      strategy: "basic"
      user: "{{ open_observe_user }}"
      password: "{{ open_observe_password }}"
    compression: "gzip"
    encoding:
      codec: "json"
      timestamp_format: "rfc3339"
    healthcheck:
      enabled: false
