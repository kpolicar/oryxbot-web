sources:
  oryxbot_client_logs:
    type: "file"
    include:
      - "/home/oryxbot/apps/Oryxbot/*.log"

transforms:
  modify:
    type: "remap"
    inputs: ["oryxbot_client_logs"]
    source: >-
      .|= parse_regex!(.message, r'^(?<_timestamp>\d+-\d+-\d+ \d+:\d+:\d+\.\d+)\|(?<severity>\w+)\|(?<logger>\w+)\|(?<message>.*)$')

      ._timestamp = parse_timestamp!(._timestamp, format: "%Y-%m-%d %H:%M:%S%.f")

      additional = {"user": "{{ open_observe_user }}"}

      . = merge(., additional)

sinks:
  oryxbot_server_logs:
    type: "http"
    inputs:
      - modify
    uri: "https://logs.oryxbot.com/api/default/default/_json"
    method: "post"
    auth:
      strategy: "basic"
      user: "{{ open_observe_user }}"
      password: "{{ open_observe_password }}"
    compression: "gzip"
    encoding:
      codec: "json"
      timestamp_format: "rfc3339"
    healthcheck:
      enabled: false

log_schema:
  timezone: "Europe/Paris"
  timestamp_key: "_timestamp"
