version: "3.8"
services:
  nginx:
    build:
      context: .
      dockerfile: ./docker/nginx.Dockerfile
    restart: always
    labels:
      caddy: oryxbot.com, dashboard.oryxbot.com
      caddy.reverse_proxy: "{{upstreams 80}}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - storage:/app/storage
    networks:
      - reverse-proxy
      - default

  soketi:
    image: 'quay.io/soketi/soketi:latest-16-alpine'
    restart: unless-stopped
    labels:
      caddy: socket.oryxbot.com
      caddy.@ws.0_header: "Connection *Upgrade*"
      caddy.@ws.1_header: "Upgrade websocket"
      caddy.0_reverse_proxy: "@ws {{upstreams 6001}}"
      caddy.1_reverse_proxy: "{{upstreams 9601}}"
    ports:
      - '${SOKETI_PORT:-6001}:6001'
      - '${SOKETI_METRICS_SERVER_PORT:-9601}:9601'
    environment:
      SOKETI_DEBUG: ${SOKETI_DEBUG:-1}
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID:-some-id}
      SOKETI_DEFAULT_APP_KEY: ${PUSHER_APP_KEY:-app-key}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_APP_SECRET:-some-app-secret}
      SOKETI_METRICS_SERVER_PORT: ${SOKETI_METRICS_SERVER_PORT:-9601}
      SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES: ${DEFAULT_APP_ENABLE_CLIENT_MESSAGES:-false}
      SERVER_PORT: ${SOKETI_PORT:-6001}
    networks:
      - reverse-proxy
      - default

  openobserve:
    image: 'public.ecr.aws/zinclabs/openobserve:v0.9.1'
    restart: unless-stopped
    labels:
      caddy: logs.oryxbot.com
      caddy.reverse_proxy: "{{upstreams 5080}}"
      caddy.@web.path: /web/*
      caddy.basicauth: "@match kpolicar ***REMOVED***"
    volumes:
      - ${OPEN_OBSERVE_PATH:-openobserve}:/app/openobserve
    environment:
      ZO_ROOT_USER_EMAIL: ${OPEN_OBSERVE_ROOT_USER:-root@oryxbot.com}
      ZO_ROOT_USER_PASSWORD: ${OPEN_OBSERVE_ROOT_PASSWORD:-***REMOVED***}
      ZO_DATA_DIR: /app/openobserve/data
    networks:
      - reverse-proxy
      - default

networks:
  reverse-proxy:
    external: true

volumes:
  storage:
  openobserve:
